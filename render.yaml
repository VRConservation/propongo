# Render Blueprint for Propongo.
# Deploy: connect your GitHub repo (VRConservation/propongo) on render.com;
# Render auto-detects this file and provisions the service below.
# Pushes to the branch trigger automatic redeploys.

services:
  - type: web
    name: propongo
    runtime: docker
    repo: https://github.com/VRConservation/propongo
    plan: basic
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PROPONGO_AUTH_ENABLED
        value: "true"
      # Set to "false" to disable self-registration (invite-only).
      - key: PROPONGO_ALLOW_REGISTRATION
        value: "true"
      # Set these two in the Render dashboard (or via the Deploy dialog) —
      # they are required to create the first admin account.
      - key: PROPONGO_ADMIN_USER
        sync: false
      - key: PROPONGO_ADMIN_PASSWORD
        sync: false
      - key: PROPONGO_ADMIN_EMAIL
        sync: false
      # SMTP settings for password-reset emails. Set SMTP_PASS (the Proton
      # SMTP token) in the Render dashboard — it is a secret and must not
      # be committed. The others can be set here or in the dashboard.
      - key: SMTP_HOST
        value: "smtp.protonmail.ch"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: "info@3point.xyz"
      - key: SMTP_FROM
        value: "info@3point.xyz"
      - key: SMTP_PASS
        sync: false
      - key: PROPONGO_SESSION_COOKIE_SECURE
        value: "true"
      - key: DEBUG
        value: "false"
    # Persistent storage for proposals/templates/exports.
    # The workspace plan can stay Hobby (free): Render attaches disks to any
    # PAID instance type (e.g. Starter $7/mo — the Free $0 instance cannot
    # attach a disk). Disk storage bills at $0.25/GB/mo.
    # Existing ephemeral data is NOT copied onto a newly attached disk.
    disk:
      name: propongo-data
      mountPath: /app/data
      sizeGB: 1
