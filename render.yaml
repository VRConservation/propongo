# Render Blueprint for Propongo.
# Deploy: connect your GitHub repo (VRConservation/propongo) on render.com;
# Render auto-detects this file and provisions the service below.
# Pushes to the branch trigger automatic redeploys.

services:
  - type: web
    name: propongo
    runtime: docker
    repo: https://github.com/VRConservation/propongo
    plan: basic
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PROPONGO_AUTH_ENABLED
        value: "true"
      # Set to "false" to disable self-registration (invite-only).
      - key: PROPONGO_ALLOW_REGISTRATION
        value: "true"
      # Set these two in the Render dashboard (or via the Deploy dialog) —
      # they are required to create the first admin account.
      - key: PROPONGO_ADMIN_USER
        sync: false
      - key: PROPONGO_ADMIN_PASSWORD
        sync: false
      - key: PROPONGO_ADMIN_EMAIL
        sync: false
      - key: PROPONGO_SESSION_COOKIE_SECURE
        value: "true"
      - key: DEBUG
        value: "false"
    # Persistent storage for proposals/templates/exports.
    # Requires the Basic plan ($7/mo) or higher — the free plan cannot attach
    # disks. Existing ephemeral data is NOT copied onto a newly attached disk.
    disk:
      name: propongo-data
      mountPath: /app/data
      sizeGB: 1
