site_name: Propongo
site_description: python package for grant management
site_author: VRConservation
site_url: https://3point.xyz/propongo
repo_url: https://github.com/VRConservation/propongo

copyright: "Copyright &copy; 2026 Vance Russell"

theme:
    palette:
        - scheme: default
        #   primary: blue
        #   accent: indigo
          toggle:
              icon: material/toggle-switch-off-outline
              name: Switch to dark mode
        - scheme: slate
          primary: indigo
          accent: indigo
          toggle:
              icon: material/toggle-switch
              name: Switch to light mode
    name: material
    icon:
        repo: fontawesome/brands/github
    # logo: assets/logo.png
    # favicon: assets/favicon.png
    features:
        - navigation.instant
        - navigation.tracking
        - navigation.top
        - search.highlight
        - search.share
    font:
        text: Google Sans
        code: Regular

plugins:
    - search
    - mkdocstrings
    - git-revision-date
    - git-revision-date-localized:
        enable_creation_date: true
        type: timeago
    # - pdf-export
    # - mkdocs-jupyter

markdown_extensions:
    - admonition
    - abbr
    - attr_list
    - def_list
    - footnotes
    - meta
    - md_in_html
    - pymdownx.details
    - pymdownx.superfences
    - pymdownx.highlight:
        linenums: true
    - toc:
        permalink: true

# extra:
#     analytics:
#         provider: google
#         property: UA-XXXXXXXXX-X

nav:
    - Home: index.md
    - Installation: installation.md
    - Usage: usage.md
    - Examples:
        - Overview: examples/index.md
        - Walkthrough: examples/walkthrough.md
        - Budget: examples/budget.md
        - Timeline: examples/timeline.md
        - Excel Import: examples/excel.md
        - Custom Sections: examples/custom.md
        - Snippet Library: examples/snippets.md
        - Templates: examples/templates.md
        - Project Tracker: examples/tracker.md
    - Contributing: contributing.md
    - FAQ: faq.md
    - Changelog: changelog.md
    - Report Issues: https://github.com/VRConservation/propongo/issues
    - API Reference: api.md

