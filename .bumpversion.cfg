[bumpversion]
current_version = 1.6.11
commit = True
tag = True
tag_name = v{new_version}
message = Bump version: {current_version} → {new_version}

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:app/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

# docs/changelog.md is deliberately NOT tracked here. bump2version does not
# interpret \n escapes in `replace`, so this used to write a literal
# "\n\n" into the file and cram every heading onto one line. Add the new
# "## {version}" heading by hand before bumping instead.
