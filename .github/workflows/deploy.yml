name: Deploy docs
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install mkdocs-material mkdocstrings[python] mkdocs-jupyter mkdocs-git-revision-date-plugin mkdocs-git-revision-date-localized-plugin
      - run: mkdocs gh-deploy --force