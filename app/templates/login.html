<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propongo - {{ _('Sign in') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div style="max-width: 400px; margin: 80px auto; padding: 0 20px;">
        <h1 style="font-size: 28px; text-align: center;">Propongo</h1>
        <p style="text-align: center; color: #64748b; margin-bottom: 24px;">{{ _('Please sign in to continue.') }}</p>

        {% if error %}
        <div style="background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:6px;padding:10px 12px;margin-bottom:16px;font-size:14px;">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('auth.login', next=request.args.get('next', '')) }}">
            <div class="form-group">
                <label for="username">{{ _('Username or email') }}</label>
                <input type="text" id="username" name="username" autocomplete="username" autofocus required>
            </div>
            <div class="form-group" style="position:relative;">
                <label for="password">{{ _('Password') }}</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required style="padding-right:40px;">
                <button type="button" onclick="togglePassword('password', this)" style="position:absolute;right:8px;top:32px;background:none;border:none;cursor:pointer;padding:4px;" aria-label="{{ _('Show password') }}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
            <p style="text-align:right;margin-top:-8px;margin-bottom:16px;"><a href="{{ url_for('auth.forgot_password') }}" style="font-size:13px;color:#64748b;">{{ _('Forgot password?') }}</a></p>
            <button type="submit" class="btn btn-primary" style="width:100%;">{{ _('Sign in') }}</button>
        </form>

        {% if allow_registration %}
        <p style="text-align:center;margin-top:16px;">{{ _('No account?') }} <a href="{{ url_for('auth.register') }}">{{ _('Create one') }}</a></p>
        {% endif %}

        <div style="text-align:center;margin-top:24px;">
            <select class="lang-select" onchange="window.location='/set-language/' + this.value" title="{{ _('Language') }}">
                {% for code, name in LANGUAGES.items() %}
                <option value="{{ code }}" {{ 'selected' if code == current_lang }}>{{ name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <script>
    function togglePassword(fieldId, btn) {
        var input = document.getElementById(fieldId);
        if (input.type === 'password') {
            input.type = 'text';
            btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
        } else {
            input.type = 'password';
            btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
        }
    }
    </script>
</body>
</html>
