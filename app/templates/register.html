<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propongo - {{ _('Create an account') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div style="max-width: 400px; margin: 80px auto; padding: 0 20px;">
        <h1 style="font-size: 28px; text-align: center;">Propongo</h1>
        <p style="text-align: center; color: #64748b; margin-bottom: 24px;">{{ _('Create an account') }}</p>

        {% if error %}
        <div style="background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:6px;padding:10px 12px;margin-bottom:16px;font-size:14px;">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('auth.register') }}">
            <div class="form-group" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;" aria-hidden="true">
                <label for="website">{{ _('Website') }}</label>
                <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="username">{{ _('Username') }}</label>
                <input type="text" id="username" name="username" autocomplete="username" autofocus required>
            </div>
            <div class="form-group">
                <label for="email">{{ _('Email') }}</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">{{ _('Password') }}</label>
                <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">{{ _('Confirm password') }}</label>
                <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">{{ _('Create account') }}</button>
        </form>

        <p style="text-align:center;margin-top:16px;">{{ _('Already have an account?') }} <a href="{{ url_for('auth.login') }}">{{ _('Sign in') }}</a></p>

        <div style="text-align:center;margin-top:24px;">
            <select class="lang-select" onchange="window.location='/set-language/' + this.value" title="{{ _('Language') }}">
                {% for code, name in LANGUAGES.items() %}
                <option value="{{ code }}" {{ 'selected' if code == current_lang }}>{{ name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
</body>
</html>
