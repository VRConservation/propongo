<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propongo - {{ _('Forgot password?') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div style="max-width: 400px; margin: 80px auto; padding: 0 20px;">
        <h1 style="font-size: 28px; text-align: center;">Propongo</h1>
        <p style="text-align: center; color: #64748b; margin-bottom: 24px;">{{ _('Enter the email address associated with your account.') }}</p>

        {% if error %}
        <div style="background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:6px;padding:10px 12px;margin-bottom:16px;font-size:14px;">{{ error }}</div>
        {% endif %}

        {% if message %}
        <div style="background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:6px;padding:10px 12px;margin-bottom:16px;font-size:14px;">{{ message }}</div>
        <p style="text-align:center;margin-top:16px;"><a href="{{ url_for('auth.login') }}">{{ _('Back to sign in') }}</a></p>
        {% else %}
        <form method="post" action="{{ url_for('auth.forgot_password') }}">
            <div class="form-group">
                <label for="email">{{ _('Email address') }}</label>
                <input type="email" id="email" name="email" autocomplete="email" autofocus required value="{{ email }}">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">{{ _('Send reset link') }}</button>
        </form>

        <p style="text-align:center;margin-top:16px;"><a href="{{ url_for('auth.login') }}">{{ _('Back to sign in') }}</a></p>
        {% endif %}

        <div style="text-align:center;margin-top:24px;">
            <select class="lang-select" onchange="window.location='/set-language/' + this.value" title="{{ _('Language') }}">
                {% for code, name in LANGUAGES.items() %}
                <option value="{{ code }}" {{ 'selected' if code == current_lang }}>{{ name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
</body>
</html>
